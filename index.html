<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>For Susoooo ❤️</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap');
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'DM Sans',sans-serif}body{overflow-x:hidden;background:#120c12;color:#fff}
.page{min-height:100vh;min-height:100dvh;position:relative;display:flex;align-items:center;justify-content:center;padding:28px;overflow:hidden;padding-top:max(28px,env(safe-area-inset-top));padding-bottom:max(28px,env(safe-area-inset-bottom));background:#120c12}
.page::before{content:"";position:absolute;inset:-30px;background-image:linear-gradient(rgba(15,7,14,.58),rgba(15,7,14,.72)),url('background.jpeg');background-size:cover;background-position:center;filter:blur(22px);transform:scale(1.08);opacity:.85}
.page::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 35%,rgba(255,139,164,.18),transparent 38%),linear-gradient(135deg,rgba(18,10,20,.35),rgba(50,20,38,.5));pointer-events:none}
.glow{position:absolute;width:360px;height:360px;border-radius:50%;filter:blur(80px);opacity:.2;background:#ff829d;animation:float 8s ease-in-out infinite;z-index:1}.g1{top:-150px;left:-120px}.g2{right:-160px;bottom:-170px;animation-delay:-4s}
.card{position:relative;width:min(450px,94vw);padding:44px 34px;border:1px solid rgba(255,255,255,.24);border-radius:32px;background:rgba(28,13,25,.55);backdrop-filter:blur(20px);box-shadow:0 30px 100px rgba(0,0,0,.45);text-align:center;z-index:2}
.heart{font-size:52px;display:inline-block;animation:beat 1.4s ease-in-out infinite}.eyebrow{font-size:12px;letter-spacing:3px;text-transform:uppercase;opacity:.76;margin-top:8px}.title{font-family:'Cormorant Garamond',serif;font-size:56px;line-height:.95;margin:16px 0 12px}.hello{font-family:'Cormorant Garamond',serif;font-size:31px;font-weight:600;margin:0 0 7px}.sub{opacity:.78;margin:0 auto 27px;max-width:310px;line-height:1.6}
.input-wrap{position:relative}.input{width:100%;height:58px;border-radius:17px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.09);color:white;padding:0 52px 0 18px;font-size:16px;outline:none;transition:.25s}.input::placeholder{color:rgba(255,255,255,.55)}.input:focus{border-color:#ff9aaa;box-shadow:0 0 0 4px rgba(255,154,170,.12)}.lock{position:absolute;right:18px;top:18px;opacity:.8}.btn{width:100%;height:58px;margin-top:13px;border:0;border-radius:17px;background:linear-gradient(135deg,#ff849c,#e65b7c);color:#fff;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 12px 30px rgba(231,91,120,.28);transition:.2s}.btn:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(231,91,120,.38)}.hint{margin-top:18px;min-height:24px;font-size:14px;color:#ffb6c2}.success{color:#bfffd4}.shake{animation:shake .4s}.spark{position:absolute;pointer-events:none;font-size:22px;animation:rise 2s ease-out forwards;z-index:5}
#reveal{display:none;position:relative;width:min(820px,96vw);z-index:2;text-align:center;animation:appear .9s ease both}.quote{font-family:'Cormorant Garamond',serif;font-size:clamp(44px,7vw,72px);font-weight:700;line-height:1.05;margin:0 auto 17px;text-shadow:0 5px 30px rgba(0,0,0,.35);direction:rtl}.line{height:1px;background:rgba(255,255,255,.4);width:110px;margin:0 auto 24px}.photo-frame{width:min(650px,94vw);margin:0 auto;border:5px solid rgba(255,255,255,.94);border-radius:25px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.55);background:#222}.photo-frame img{display:block;width:100%;height:min(68vh,610px);object-fit:cover;object-position:center}
.player{margin:18px auto 0;max-width:650px;padding:17px 20px;border:1px solid rgba(255,255,255,.2);border-radius:20px;background:rgba(30,15,28,.6);backdrop-filter:blur(18px);display:flex;align-items:center;gap:15px;text-align:left}.disc{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.13);font-size:24px;flex:none}.track{flex:1;min-width:0}.track b{display:block;font-size:15px}.track small{display:block;opacity:.65;margin-top:3px}.music-btn{border:0;border-radius:50%;width:48px;height:48px;background:#ff8095;color:#fff;font-size:18px;cursor:pointer;flex:none}.native-audio{display:none}.note{margin-top:22px;font-family:'Cormorant Garamond',serif;font-size:28px}.back{margin-top:18px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.12);color:#fff;padding:10px 16px;border-radius:12px;cursor:pointer;opacity:.78}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.13)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(25px)}}@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}@keyframes rise{0%{opacity:1;transform:translateY(0) scale(.7)}100%{opacity:0;transform:translateY(-150px) scale(1.3)}}@keyframes appear{from{opacity:0;transform:translateY(25px) scale(.98)}to{opacity:1;transform:none}}
@media (max-width:600px){
  html,body{width:100%;min-height:100%;}
  body{overscroll-behavior:none;-webkit-text-size-adjust:100%;}
  .page{
    min-height:100svh;
    min-height:100dvh;
    width:100%;
    padding:18px 14px;
    padding-top:max(18px,env(safe-area-inset-top));
    padding-right:max(14px,env(safe-area-inset-right));
    padding-bottom:max(18px,env(safe-area-inset-bottom));
    padding-left:max(14px,env(safe-area-inset-left));
    align-items:center;
  }
  .page::before{background-position:center center;filter:blur(18px);transform:scale(1.12);}
  .glow{width:230px;height:230px;filter:blur(65px);}
  .card{
    width:100%;
    max-width:430px;
    padding:30px 20px;
    border-radius:26px;
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
  }
  .heart{font-size:44px}
  .eyebrow{font-size:10px;letter-spacing:2.4px}
  .hello{font-size:29px;margin-top:8px}
  .title{font-size:46px;line-height:.98;margin:13px 0 10px}
  .sub{font-size:14px;line-height:1.5;margin-bottom:22px;max-width:300px}
  .input{height:54px;font-size:16px;border-radius:15px;padding-left:16px}
  .btn{height:54px;border-radius:15px;margin-top:11px}
  #reveal{
    width:100%;
    max-width:560px;
    padding:8px 0 10px;
  }
  #reveal .eyebrow{margin-bottom:7px}
  .quote{
    font-size:clamp(42px,13vw,58px);
    margin-bottom:12px;
    line-height:1.1;
  }
  .line{width:80px;margin-bottom:16px}
  .photo-frame{
    width:100%;
    max-width:430px;
    border-width:4px;
    border-radius:20px;
    margin:0 auto;
  }
  .photo-frame img{
    width:100%;
    height:auto;
    aspect-ratio:4/5;
    max-height:62svh;
    max-height:62dvh;
    object-fit:cover;
    object-position:center;
  }
  .player{
    width:100%;
    max-width:430px;
    margin-top:14px;
    padding:12px;
    border-radius:17px;
    gap:10px;
  }
  .disc{width:44px;height:44px;font-size:20px}
  .track b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .track small{font-size:11px}
  .music-btn{width:44px;height:44px;font-size:16px}
  .note{font-size:24px;margin-top:16px}
  .back{margin-top:13px;font-size:13px;padding:9px 14px}
}
@media (max-height:700px) and (max-width:600px){
  .card{padding:22px 18px}
  .heart{font-size:36px}
  .title{font-size:40px}
  .sub{margin-bottom:16px}
  .input,.btn{height:50px}
  .photo-frame img{max-height:52svh;max-height:52dvh}
  .quote{font-size:40px}
  .note{display:none}
}
@media (orientation:landscape) and (max-height:500px){
  .page{align-items:flex-start;overflow-y:auto}
  .card{margin:12px auto}
  #reveal{margin:12px auto}
  .photo-frame img{aspect-ratio:16/10;max-height:none}
  .note{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="page" id="page">
  <div class="glow g1"></div><div class="glow g2"></div>
  <section class="card" id="lockScreen">
    <div class="heart">♡</div>
    <div class="eyebrow">A tiny surprise for you</div>
    <h2 class="hello">Hi Susoooo ❤️</h2>
    <h1 class="title">Guess the password</h1>
    <p class="sub">I made a little something for you... but first, you have to unlock it. ✨</p>
    <div class="input-wrap"><input id="password" class="input" type="password" placeholder="Enter password..." autocomplete="off" /><span class="lock">🔒</span></div>
    <button class="btn" id="unlock">Unlock ♥</button>
    <div class="hint" id="hint">I know you can guess it 😉</div>
  </section>

  <section id="reveal">
    <div class="eyebrow">For you, Susoooo ✨</div>
    <div class="quote">بحبك</div>
    <div class="line"></div>
    <div class="photo-frame"><img src="photo1.jpeg" alt="A special memory" /></div>
    <div class="player">
      <div class="disc">♫</div>
      <div class="track"><b>Perfect — Ed Sheeran</b><small>For this moment ❤️</small></div>
      <button class="music-btn" id="music" aria-label="Play or pause song">▶</button>
    </div>
    <audio id="song" class="native-audio" preload="auto" src="perfect.mp3"></audio>
    <div class="note">A little memory, just for you ❤️</div>
    <button class="back" id="back">Lock again</button>
  </section>
</div>
<script>
const PASSWORD='aaa';
const lockScreen=document.getElementById('lockScreen');
const reveal=document.getElementById('reveal');
const input=document.getElementById('password');
const hint=document.getElementById('hint');
const song=document.getElementById('song');
const music=document.getElementById('music');
let playing=false;
function burst(){for(let i=0;i<24;i++){const s=document.createElement('span');s.className='spark';s.textContent=['♥','♡','✦','✨','☺'][Math.floor(Math.random()*5)];s.style.left=(30+Math.random()*40)+'vw';s.style.top=(42+Math.random()*18)+'vh';s.style.animationDelay=(Math.random()*.3)+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),2300)}}
function syncMusic(){playing=!song.paused;music.textContent=playing?'Ⅱ':'▶'}
async function playSong(){try{await song.play();syncMusic()}catch(e){music.textContent='▶'}}
function unlock(){
  if(input.value===PASSWORD){
    hint.textContent='Correct! 😊 ❤️';hint.className='hint success';burst();
    lockScreen.style.transition='1s';lockScreen.style.transform='scale(.92)';lockScreen.style.opacity='0';
    setTimeout(()=>{lockScreen.style.display='none';reveal.style.display='block';playSong()},700);
  }else{
    hint.textContent='Hmm... try again 😊';lockScreen.classList.remove('shake');void lockScreen.offsetWidth;lockScreen.classList.add('shake');input.select();
  }
}
document.getElementById('unlock').addEventListener('click',unlock);
input.addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
music.addEventListener('click',()=>playing?song.pause():playSong());
song.addEventListener('play',syncMusic);song.addEventListener('pause',syncMusic);song.addEventListener('ended',syncMusic);
document.getElementById('back').addEventListener('click',()=>{song.pause();song.currentTime=0;playing=false;syncMusic();reveal.style.display='none';lockScreen.style.display='block';requestAnimationFrame(()=>{lockScreen.style.opacity='1';lockScreen.style.transform='none'});input.value='';hint.textContent='I know you can guess it 😉';hint.className='hint'});
</script>
</body>
</html>
